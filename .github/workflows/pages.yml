# Builds the web version with love.js (LÖVE 11.4 compiled to WebAssembly) and
# publishes it on GitHub Pages after every push to main.
name: Web build (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pack game.love
        run: zip -9 -r game.love . -x '.git/*' '.github/*' 'refs/*' 'web/*' '*.DS_Store'
      - name: Build with love.js (compatibility mode, no SharedArrayBuffer needed)
        run: npx --yes love.js@11.4.1 -c -t "Сага о Грише" -m 268435456 game.love dist
      - name: Our page and the downloadable .love
        run: |
          cp web/index.html dist/index.html
          cp game.love dist/game.love
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
